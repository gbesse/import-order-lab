name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q import_order_lab
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/installed
      - run: /tmp/installed/bin/pip install --no-deps dist/*.whl
      - run: cd /tmp && /tmp/installed/bin/python -m import_order_lab "$GITHUB_WORKSPACE/examples/demo.json" --lang fr
      - run: cd /tmp && /tmp/installed/bin/python -m import_order_lab "$GITHUB_WORKSPACE/examples/demo.json" --lang en
      - run: cd /tmp && /tmp/installed/bin/python -m import_order_lab "$GITHUB_WORKSPACE/examples/demo.json" --lang es
